name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  scratch-org-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      # Workaround for Salesforce CLI bug C-1016: `sf org create scratch` fails
      # when the Dev Hub is authenticated via an External Client App (JWT
      # Bearer Flow), because scratch org signup can't replicate that app type
      # into the new org. Classic Connected App creation is disabled on this
      # Dev Hub (Spring '26), so JWT isn't available here — we authenticate
      # with a stored SFDX auth URL (refresh token) instead.
      # https://github.com/forcedotcom/cli/issues/3515
      - name: Write Dev Hub auth URL file
        env:
          SF_DEVHUB_SFDX_AUTH_URL: ${{ secrets.SF_DEVHUB_SFDX_AUTH_URL }}
        run: echo "$SF_DEVHUB_SFDX_AUTH_URL" > devhub_auth_url.txt

      - name: Authenticate Dev Hub via SFDX auth URL
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub_auth_url.txt \
            --alias devhub \
            --set-default-dev-hub

      - name: Remove Dev Hub auth URL file
        if: always()
        run: rm -f devhub_auth_url.txt

      - name: Create scratch org
        run: |
          sf org create scratch \
            --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias ci-scratch \
            --duration-days 1 \
            --set-default \
            --wait 10

      - name: Deploy force-app to scratch org
        run: sf project deploy start --source-dir force-app --target-org ci-scratch

      - name: Run Apex tests (RunLocalTests)
        run: |
          sf apex run test \
            --target-org ci-scratch \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30 \
            --synchronous

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci-scratch --no-prompt
