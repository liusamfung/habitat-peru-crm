# Unique name for this workflow
name: CI

# Definition when the workflow should run
on:
  pull_request:
    branches:
      - main

# Jobs to be executed
jobs:
  format-lint-lwc-tests:
    runs-on: ubuntu-latest
    steps:
      # Checkout the source code
      - name: "Checkout source code"
        uses: actions/checkout@v7.0.0

      # Install Node, reading .node-version — the same file mise reads locally,
      # so CI and the developer machine cannot drift apart.
      # `cache: npm` caches npm's download directory (~/.npm), not node_modules.
      - name: "Set up Node"
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      # Install npm dependencies for Prettier and Jest.
      # Runs unconditionally: since the cache above holds downloads rather than
      # node_modules, `npm ci` stays fast while still matching the lockfile exactly.
      - name: "Install npm dependencies"
        run: HUSKY=0 npm ci

      # Prettier formatting
      - name: "Code formatting verification with Prettier"
        run: npm run prettier:verify

      # Lint LWC / Aura
      - name: "Lint Lightning Web Components / Aura Components"
        run: npm run lint

      # LWC unit tests
      - name: "Unit test Lightning Web Components"
        run: npm run test:unit:coverage

      # Code Analyzer runs on the Salesforce CLI. It needs no org, so it lives in
      # this job: a violation fails the run in seconds, before a scratch org is
      # created. Its Java engines run on the JDK 17 preinstalled on ubuntu-latest.
      - name: "Install Salesforce CLI"
        run: npm install @salesforce/cli --location=global

      - name: "Install Code Analyzer plugin"
        run: sf plugins install code-analyzer

      # Runs the same `scan` script as the local pre-push hook (see package.json),
      # so CI can never fail on something that passed on the developer's machine.
      - name: "Static analysis of Apex with Code Analyzer"
        run: npm run scan

  scratch-org-test:
    runs-on: ubuntu-latest
    needs: format-lint-lwc-tests
    # GitHub's Linux runners have no OS keychain service. Without this, the
    # Salesforce CLI's keychain lookup fails silently after a successful OAuth
    # exchange and surfaces as a misleading RefreshTokenAuthError.
    # https://github.com/forcedotcom/cli/issues/2922
    env:
      SF_USE_GENERIC_UNIX_KEYCHAIN: "true"
    steps:
      # Install Salesforce CLI
      - name: "Install Salesforce CLI"
        run: npm install @salesforce/cli --location=global

      # Checkout the source code
      - name: "Checkout source code"
        uses: actions/checkout@v7.0.0

      # Store secret for dev hub.
      # Uses an SFDX auth URL instead of JWT because of CLI bug C-1016:
      # `sf org create scratch` fails when the Dev Hub is authenticated via an
      # External Client App. https://github.com/forcedotcom/cli/issues/3515
      - name: "Populate auth file with SF_DEVHUB_SFDX_AUTH_URL secret"
        shell: bash
        env:
          SF_DEVHUB_SFDX_AUTH_URL: ${{ secrets.SF_DEVHUB_SFDX_AUTH_URL }}
        run: |
          echo "$SF_DEVHUB_SFDX_AUTH_URL" > ./DEVHUB_AUTH_URL.txt
          secretFileSize=$(wc -c "./DEVHUB_AUTH_URL.txt" | awk '{print $1}')
          if [ $secretFileSize == 1 ]; then
              echo "Missing SF_DEVHUB_SFDX_AUTH_URL secret. Is this workflow running on a fork?";
              exit 1;
          fi

      # Authenticate dev hub
      - name: "Authenticate Dev Hub"
        run: sf org login sfdx-url -f ./DEVHUB_AUTH_URL.txt -a devhub -d

      # Create scratch org
      - name: "Create scratch org"
        run: sf org create scratch -f config/project-scratch-def.json -a scratch-org -d -y 1

      # Deploy source to scratch org
      - name: "Push source to scratch org"
        run: sf project deploy start

      # Run Apex tests in scratch org
      - name: "Run Apex tests"
        run: sf apex run test -c -r human -w 20

      # Housekeeping
      - name: "Delete scratch org"
        if: always()
        run: sf org delete scratch -p -o scratch-org
